# Navigation2 Configuration for Humanoid Robots
# This configuration optimizes Nav2 for bipedal locomotion and human-centric environments

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha_slowweight: 0.0
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_controller_active_condition_bt_node
      - nav2_is_planner_active_condition_bt_node
      - nav2_is_goal_reached_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_are_error_recovery_statistics_updated_condition_bt_node
      - nav2_would_a_controller_recovery_help_condition_bt_node
      - nav2_would_a_planner_recovery_help_condition_bt_node
      - nav2_initial_heading_forwarded_condition_bt_node
      # Humanoid-specific behavior tree nodes
      - nav2_humanoid_balance_recovery_bt_node
      - nav2_humanoid_gait_aware_planner_bt_node
      - nav2_social_navigation_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0  # Lower for humanoid stability
    min_x_velocity_threshold: 0.05  # Higher threshold for stability
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["HumanoidController"]

    # Humanoid-specific controller
    HumanoidController:
      plugin: "module3_isaac_integration::BalanceAwareController"
      # Slower for stability
      speed_lim_v: 0.3  # Linear velocity limit (m/s)
      speed_lim_w: 0.5  # Angular velocity limit (rad/s)
      # Acceleration limits for smooth motion
      acc_lim_v: 0.25   # Linear acceleration limit
      acc_lim_w: 0.5    # Angular acceleration limit
      # Balance constraints
      balance_threshold: 0.7
      gait_frequency: 2.0  # Hz for walking gait
      step_length_max: 0.6  # Maximum step length (meters)

    # Standard controller (fallback)
    FollowPath:
      plugin: "nav2_mppi::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_rollout_costs: true
      rolling_window: true
      width: 6  # Smaller window for humanoid (slower processing)
      height: 6
      resolution: 0.05  # Higher resolution for precision
      robot_radius: 0.35  # Larger for humanoid safety
      plugins: ["obstacle_layer", "inflation_layer", "balance_constraint_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0  # Higher for humanoid safety
        inflation_radius: 0.7     # Larger for humanoid safety
        inflate_unknown: false

      balance_constraint_layer:
        plugin: "module3_isaac_integration::BalanceConstraintLayer"
        enabled: true
        weight: 2.0
        stability_threshold: 0.8
        slope_cost_factor: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.35  # Humanoid-specific
      resolution: 0.05    # Higher resolution
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "gait_constraint_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7  # Larger for humanoid safety
        inflate_unknown: false

      gait_constraint_layer:
        plugin: "module3_isaac_integration::GaitConstraintLayer"
        enabled: true
        weight: 1.5
        step_length_limit: 0.6  # Maximum step length (meters)
        turning_radius_limit: 0.5  # Minimum turning radius (meters)

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
      # Humanoid-specific parameters
      human_aware_planning: true
      gait_aware_planning: true
      balance_constraint_weight: 0.8
      step_constraint_weight: 0.6
      max_planning_time: 5.0  # seconds

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait", "humanoid_balance_recovery"]
    spin:
      plugin: "nav2_behaviors/Spin"
      spin_dist: 1.57  # 90 degrees for more careful turning
      time_allowance: 10
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: 0.2  # Longer backup for humanoid stability
      backup_speed: 0.05  # Slower backup
      time_allowance: 10
    wait:
      plugin: "nav2_behaviors/Wait"
      wait_duration: 1.0
    humanoid_balance_recovery:
      plugin: "module3_isaac_integration::BalanceRecovery"
      recovery_time: 5.0
      stability_threshold: 0.8

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200