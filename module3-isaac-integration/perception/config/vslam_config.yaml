# Isaac ROS Visual SLAM Configuration for Humanoid Robots
# This configuration optimizes VSLAM for humanoid-specific requirements

vslam_config:
  # Core VSLAM parameters
  core:
    # Feature detection
    feature_detector:
      type: "fast"  # Options: fast, shi_tomasi, harris
      max_features: 1500  # Reduced for humanoid (smaller FOV)
      min_feature_distance: 15.0  # pixels
      quality_level: 0.01
      block_size: 3
      enable_subpixel_refinement: true

    # Tracking
    tracking:
      enable_rectified_edge: true
      enable_debug_mode: false
      publish_tf: true
      max_tracking_features: 2000
      tracking_threshold: 10  # min tracked features
      enable_motion_model: true

    # Mapping
    mapping:
      enable_localization: true
      enable_mapping: true
      map_resolution: 0.05  # meters per pixel
      map_size: [20.0, 20.0]  # meters
      max_keyframes: 500
      enable_loop_closure: true
      loop_closure_threshold: 0.7

  # Humanoid-specific parameters
  humanoid:
    # Motion compensation
    motion_compensation:
      enable_balance_compensation: true
      enable_gait_compensation: true
      gait_frequency: 2.0  # Hz
      step_length: 0.6  # meters
      balance_bandwidth: 1.0  # Hz for balance filtering
      max_lean_angle: 15.0  # degrees

    # Sensor configuration
    sensors:
      camera:
        frame_id: "camera_link"
        optical_frame_id: "camera_optical_frame"
        image_topic: "/camera/image_rect_color"
        info_topic: "/camera/camera_info"
        resolution: [640, 480]  # Reduced for performance
        fps: 30  # Target frame rate

      imu:
        enable_fusion: true
        topic: "/imu/data"
        frame_id: "imu_link"
        update_rate: 100  # Hz

      leg_odometry:
        enable_fusion: true
        joint_topic: "/joint_states"
        enable_kinematic_fusion: true

    # Environment awareness
    environment:
      social_navigation:
        enable_personal_space: true
        personal_space_radius: 0.8  # meters
        enable_social_zone_mapping: true
        social_zone_buffer: 0.5  # meters

      human_centric:
        focus_area_detection: true
        prioritize_human_objects: true
        enable_face_detection: false  # Performance consideration
        human_detection_threshold: 0.5

  # GPU acceleration settings
  gpu:
    enable_gpu_acceleration: true
    gpu_device_id: 0
    gpu_memory_fraction: 0.85
    enable_tensorrt: true
    tensorrt_precision: "fp16"  # Options: fp32, fp16, int8
    max_concurrent_frames: 2
    enable_async_processing: true

  # Performance optimization
  performance:
    # Real-time constraints
    max_processing_time_ms: 30.0  # 30 FPS target
    enable_adaptive_processing: true
    target_fps: 30
    pipeline_depth: 3

    # Memory management
    enable_memory_pooling: true
    memory_pool_size_mb: 512
    enable_batch_processing: true
    max_batch_size: 4

    # Optimization flags
    enable_bundle_adjustment: true
    local_ba_frequency: 10  # every N keyframes
    global_ba_frequency: 100  # every N keyframes
    enable_local_optimization: true
    enable_global_optimization: true

  # Frame management
  frames:
    world_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    camera_frame: "camera_link"
    imu_frame: "imu_link"

    # TF publishing
    publish_camera_tf: true
    publish_odom_tf: true
    tf_publish_rate: 50.0  # Hz

  # Quality control
  quality:
    min_features_for_tracking: 50
    max_reprojection_error: 2.0  # pixels
    feature_matching_threshold: 0.8
    pose_consistency_threshold: 0.1  # meters
    tracking_confidence_threshold: 0.7

  # Safety and reliability
  safety:
    enable_safety_checks: true
    max_linear_velocity: 1.0  # m/s - for motion model
    max_angular_velocity: 1.0  # rad/s - for motion model
    tracking_loss_recovery: true
    relocalization_threshold: 1.0  # meters position drift
    enable_emergency_stop: true

  # Debug and logging
  debug:
    enable_detailed_logging: false
    log_level: "INFO"  # Options: DEBUG, INFO, WARN, ERROR
    enable_visualization: true
    visualization_topic: "/vslam/visualization"
    save_debug_data: false
    debug_output_path: "/tmp/vslam_debug"

  # Calibration parameters
  calibration:
    stereo_baseline: 0.2  # meters (for stereo cameras)
    rectification_alpha: 0.0  # 0=valid pixels only, 1=full view
    enable_undistortion: true
    distortion_model: "plumb_bob"

  # Multi-camera support
  multi_camera:
    enable_multi_camera: false  # Enable for multi-camera setups
    camera_count: 1
    stereo_mode: true  # Enable stereo processing
    stereo_matching:
      enable_stereo_matching: true
      min_disparity: 0
      max_disparity: 128
      sad_window_size: 9