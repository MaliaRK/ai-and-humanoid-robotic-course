# Humanoid Robot Navigation2 Configuration

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha_slowweight: 0.0
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # NOTE: For humanoid, may need custom model
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_nav_to_pose_bt_xml: $(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_controller_active_condition_bt_node
      - nav2_is_planner_active_condition_bt_node
      - nav2_is_goal_reached_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_are_error_recovery_statistics_updated_condition_bt_node
      - nav2_would_a_controller_recovery_help_condition_bt_node
      - nav2_would_a_planner_recovery_help_condition_bt_node
      - nav2_initial_heading_forwarded_condition_bt_node
      # Humanoid-specific behavior tree nodes
      - nav2_humanoid_balance_recovery_bt_node
      - nav2_humanoid_gait_aware_planner_bt_node
      - nav2_social_navigation_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0  # Lower frequency for humanoid stability
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["HumanoidMPPICtrl"]

    # Humanoid-specific controller using Isaac ROS balance-aware approach
    HumanoidMPPICtrl:
      plugin: "nav2_mppi::HumanoidMPPICtrl"
      # Humanoid-specific parameters
      speed_limit_scale: 0.6  # Slower for stability
      model_type: "nav2_mppi::HumanoidModel"  # Custom humanoid model
      # Humanoid dynamics parameters
      max_linear_speed: 0.3  # m/s (slower for balance)
      max_angular_speed: 0.5  # rad/s
      max_linear_accel: 0.15  # m/s² (slower acceleration for balance)
      max_angular_accel: 0.3  # rad/s²
      # Balance-aware parameters
      balance_threshold: 0.75
      gait_frequency: 2.0  # Hz for walking gait
      step_length_max: 0.6  # meters
      step_height_max: 0.15  # meters
      # Social navigation parameters
      personal_space_radius: 0.4  # meters
      social_zone_radius: 0.8   # meters

    # Progress checker for humanoid navigation
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5  # Larger for humanoid (accounting for gait)
      movement_time_allowance: 10.0

    # Goal checker for humanoid navigation
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3  # Larger for humanoid locomotion
      yaw_goal_tolerance: 0.2  # 11.4 degrees
      stateful: True

    # Standard controller (backup)
    FollowPath:
      plugin: "nav2_mppi::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_rollout_costs: True
      rolling_window: True
      width: 6  # Larger for humanoid (wider step coverage)
      height: 6
      resolution: 0.05  # Higher resolution for precision
      robot_radius: 0.35  # Larger for humanoid safety
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer", "balance_constraint_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud_mark
        pointcloud_mark:
          topic: /isaac_ros/pointcloud
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          obstacle_range: 2.5
          raytrace_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0  # Higher for humanoid safety
        inflation_radius: 0.7     # Larger for humanoid safety
        inflate_unknown: False

      balance_constraint_layer:
        plugin: "module3_isaac_integration::BalanceConstraintLayer"
        enabled: True
        weight: 2.0
        stability_threshold: 0.8
        slope_cost_factor: 2.0
        step_height_cost_factor: 3.0

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.35  # Humanoid-specific
      resolution: 0.05    # Higher resolution for detail
      track_unknown_space: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "gait_constraint_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7  # Larger for humanoid safety
        inflate_unknown: False

      gait_constraint_layer:
        plugin: "module3_isaac_integration::GaitConstraintLayer"
        enabled: True
        weight: 1.5
        step_length_limit: 0.6  # Maximum step length (meters)
        turning_radius_limit: 0.5  # Minimum turning radius (meters)
        balance_constraint_weight: 0.8

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "turtlebot3_world.yaml"

map_server_map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0  # Higher frequency for dynamic humanoid navigation
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5  # Larger tolerance for humanoid navigation
      use_astar: False
      allow_unknown: True
      # Humanoid-specific parameters
      human_aware_planning: True
      gait_aware_planning: True
      balance_constraint_weight: 0.8
      step_constraint_weight: 0.6
      max_planning_time: 5.0  # seconds

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait", "humanoid_balance_recovery"]
    spin:
      plugin: "nav2_behaviors/Spin"
      spin_dist: 1.57  # 90 degrees for more careful turning with humanoid
      time_allowance: 10
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: 0.2  # Longer backup for humanoid stability
      backup_speed: 0.05  # Slower backup for balance
      time_allowance: 10
    wait:
      plugin: "nav2_behaviors/Wait"
      wait_duration: 1.0
    humanoid_balance_recovery:
      plugin: "module3_isaac_integration::BalanceRecovery"
      recovery_time: 5.0
      stability_threshold: 0.8

behavior_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback_type: "OPEN_LOOP"
    velocity_timeout: 1.0
    max_velocity: [0.5, 0.0, 1.0]  # Humanoid-specific limits
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.25, 0.0, 0.5]    # Lower for humanoid stability
    max_decel: [-0.5, 0.0, -0.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: 0.0
    velocity_scale: 1.0
